# Epic AI - API-Only Development Environment
# Run database, redis, workers, and API (no frontend)
# Frontend runs on Vercel separately
# Run with: docker compose -f docker-compose.api-only.yml up -d

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: epic-ai-postgres-dev
    environment:
      POSTGRES_DB: epic_dev
      POSTGRES_USER: epic
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epic"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - epic-network

  # Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: epic-ai-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - epic-network

  # Web API (Next.js - API routes only)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    container_name: epic-ai-web-dev
    environment:
      # Database
      DATABASE_URL: postgresql://epic:${DB_PASSWORD:-devpassword}@postgres:5432/epic_dev

      # Redis
      REDIS_URL: redis://redis:6379

      # Development
      NODE_ENV: production
      UAT_AUTH_BYPASS: "true"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
      CLERK_SECRET_KEY: sk_test_dummy

      # App URLs - Point to dev.leads.epic.dm
      NEXT_PUBLIC_APP_URL: https://dev.leads.epic.dm

      # OpenAI (optional)
      OPENAI_API_KEY: sk_test_dummy

      # Voice service
      VOICE_SERVICE_URL: http://localhost:8000
    volumes:
      # Keep Docker image's installed packages, don't mount host ./packages
      # This preserves the pnpm install that ran during build
      - /app/node_modules
      - /app/apps/web/.next
      - /app/.pnpm-store
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - epic-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Background Workers (BullMQ)
  workers:
    build:
      context: .
      dockerfile: Dockerfile.workers.dev
    container_name: epic-ai-workers-dev
    environment:
      # Database
      DATABASE_URL: postgresql://epic:${DB_PASSWORD:-devpassword}@postgres:5432/epic_dev

      # Redis
      REDIS_URL: redis://redis:6379

      # Development
      NODE_ENV: production

      # OpenAI (optional)
      OPENAI_API_KEY: sk_test_dummy

      # Queue configuration
      BULLMQ_PREFIX: epic
      CALLBACK_QUEUE_NAME: telephony-callback

      # Health check port
      HEALTH_PORT: "3001"
    volumes:
      # Keep Docker image's installed packages, don't mount host ./packages
      # This preserves the pnpm install that ran during build
      - /app/node_modules
      - /app/apps/workers/dist
      - /app/.pnpm-store
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - epic-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # nginx Reverse Proxy - Exposes API to internet
  nginx:
    image: nginx:alpine
    container_name: epic-ai-nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.api-only.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - workers
    restart: unless-stopped
    networks:
      - epic-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_dev:
    driver: local
  redis_dev:
    driver: local

networks:
  epic-network:
    driver: bridge
