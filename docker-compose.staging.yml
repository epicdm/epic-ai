# Epic AI - Staging Environment
# Deploy with: docker-compose -f docker-compose.staging.yml up -d

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: epic-ai-postgres-staging
    environment:
      POSTGRES_DB: epic_staging
      POSTGRES_USER: epic
      POSTGRES_PASSWORD: ${DB_PASSWORD:-epic_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epic"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - epic-network

  # Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: epic-ai-redis-staging
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - epic-network

  # Web Frontend (Next.js)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: epic-ai-web-staging
    environment:
      # Database
      DATABASE_URL: postgresql://epic:${DB_PASSWORD:-epic_password}@postgres:5432/epic_staging

      # Redis
      REDIS_URL: redis://redis:6379

      # Clerk (UAT bypass for staging)
      NODE_ENV: production
      UAT_AUTH_BYPASS: "true"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_dummy}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_dummy}

      # App URLs
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost}

      # OpenAI (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk_test_dummy}

      # Other services
      VOICE_SERVICE_URL: ${VOICE_SERVICE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - epic-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Background Workers (BullMQ)
  workers:
    build:
      context: .
      dockerfile: Dockerfile.workers
    container_name: epic-ai-workers-staging
    environment:
      # Database
      DATABASE_URL: postgresql://epic:${DB_PASSWORD:-epic_password}@postgres:5432/epic_staging

      # Redis
      REDIS_URL: redis://redis:6379

      # Environment
      NODE_ENV: production

      # OpenAI (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk_test_dummy}

      # Queue configuration
      BULLMQ_PREFIX: epic
      CALLBACK_QUEUE_NAME: telephony-callback

      # Health check port
      HEALTH_PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - epic-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: epic-ai-nginx-staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.staging.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    restart: always
    networks:
      - epic-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  epic-network:
    driver: bridge
