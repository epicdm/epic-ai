# DigitalOcean App Platform Configuration
# This deploys the background worker service for long-running tasks

name: epic-ai-platform
region: nyc

# ===========================================
# SERVICES (Web-accessible)
# ===========================================

services:
  # Voice Service (Flask backend for LiveKit and Magnus Billing)
  - name: voice-service
    github:
      repo: epicdm/epic-ai
      branch: staging
      deploy_on_push: true
    source_dir: apps/voice-service
    dockerfile_path: apps/voice-service/Dockerfile
    instance_count: 1
    instance_size_slug: basic-xs  # 1 vCPU, 512MB RAM
    http_port: 8000
    routes:
      - path: /voice
    health_check:
      http_path: /health
      initial_delay_seconds: 10
      period_seconds: 30
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: LIVEKIT_URL
        scope: RUN_TIME
        type: SECRET
      - key: LIVEKIT_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: LIVEKIT_API_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: MAGNUS_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MAGNUS_API_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: MAGNUS_PUBLIC_URL
        scope: RUN_TIME
        type: SECRET
      - key: MAGNUS_SIP_SERVER
        scope: RUN_TIME
        type: SECRET
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO

# ===========================================
# WORKERS (Background processing)
# ===========================================

workers:
  # Background worker for content generation, scraping, etc.
  # T050: Health check available on internal port 3001 (/health)
  # NOTE: Builds from monorepo root to resolve @epic-ai/database workspace dependency
  - name: content-worker
    github:
      repo: epicdm/epic-ai
      branch: main
      deploy_on_push: true
    # NO source_dir - build from monorepo root for workspace dependencies
    build_command: |
      corepack enable
      corepack prepare pnpm@9.0.0 --activate
      pnpm install --frozen-lockfile
      cd packages/database && pnpm build && cd ../..
      cd apps/workers && pnpm build
    run_command: node apps/workers/dist/index.js
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
      - key: OPENAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      # T050: Health check port (internal only, not exposed externally)
      - key: HEALTH_PORT
        scope: RUN_TIME
        value: "3001"

  # Scheduler worker for cron-based job scheduling
  # Runs continuously alongside the main worker
  - name: content-scheduler
    github:
      repo: epicdm/epic-ai
      branch: main
      deploy_on_push: true
    # NO source_dir - build from monorepo root for workspace dependencies
    build_command: |
      corepack enable
      corepack prepare pnpm@9.0.0 --activate
      pnpm install --frozen-lockfile
      cd packages/database && pnpm build && cd ../..
      cd apps/workers && pnpm build
    run_command: node apps/workers/dist/scheduler.js
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

# ===========================================
# JOBS (Scheduled tasks)
# ===========================================

# NOTE: content-scheduler is now a worker (see workers section)
# PRE_DEPLOY jobs must complete and exit. The scheduler runs continuously
# with cron tasks, so it belongs in the workers section.

# ===========================================
# DATABASES
# ===========================================

databases:
  - name: epic-ai-db
    engine: PG
    version: "16"
    size: db-s-1vcpu-1gb
    num_nodes: 1
