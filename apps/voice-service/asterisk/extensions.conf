; ============================================================================
; Epic AI Voice Service - Asterisk Dialplan (KV String Format)
; ============================================================================
;
; This dialplan handles inbound calls with DTMF-first interaction.
; Uses KV string responses (pipe-delimited) for easy parsing with CUT().
;
; Flow:
; 1. Call arrives on DID
; 2. Call voice-service /telephony/inbound-start
; 3. If ACTION=REJECT: play SAY message and hangup
; 4. If ACTION=DTMF_MENU: play GREETING, present DTMF menu
; 5. On DTMF: call /telephony/dtmf, play SAY response, check NEXT action
; 6. On timeout: record voicemail if REC_ENABLE=1, send to /telephony/record
; 7. On hangup: call /telephony/hangup
;
; Requirements:
; - curl (for HTTP requests)
; - PicoTTS or Festival (for local TTS)
; - sox (for audio file info)
;
; ============================================================================

[globals]
; Epic AI Voice Service endpoint
VOICE_SERVICE_URL=http://localhost:8000

; TTS settings (using PicoTTS)
TTS_ENGINE=pico
TTS_VOICE=en-US

; Recording settings (overridden by runtime response)
RECORDING_DIR=/var/spool/asterisk/recordings
RECORDING_FORMAT=wav

; ============================================================================
; Inbound DID Context
; ============================================================================

[epic-inbound]
; Entry point for all Epic AI inbound calls
; Match your DID pattern here

exten => _1NXXNXXXXXX,1,NoOp(=== Epic AI Inbound Call ===)
    same => n,Set(CALL_ID=${UNIQUEID})
    same => n,Set(DID=${EXTEN})
    same => n,Set(CALLER=${CALLERID(num)})
    same => n,NoOp(DID: ${DID}, Caller: ${CALLER}, CallID: ${CALL_ID})

    ; Initialize variables
    same => n,Set(SESSION_ID=)
    same => n,Set(AGENT_ID=)
    same => n,Set(DTMF_RETRY_COUNT=0)

    ; Call voice-service to gate + route
    same => n,Gosub(epic-gate-and-route,s,1)

    ; Check result (ACTION field from KV response)
    same => n,GotoIf($["${GATE_ACTION}" = "REJECT"]?reject:connect)

    ; Rejected path
    same => n(reject),NoOp(Call rejected: ${GATE_SAY})
    same => n,Gosub(epic-speak,s,1(${GATE_SAY}))
    same => n,Hangup()

    ; Connected path
    same => n(connect),NoOp(Connected - Agent: ${AGENT_ID}, Session: ${SESSION_ID})
    same => n,Gosub(epic-greeting,s,1)
    same => n,Gosub(epic-dtmf-loop,s,1)
    same => n,Hangup()

; ============================================================================
; Subroutine: Gate and Route
; ============================================================================

[epic-gate-and-route]
exten => s,1,NoOp(=== Gate and Route ===)

    ; Build JSON payload
    same => n,Set(JSON_PAYLOAD={"did":"${DID}","from":"${CALLER}","callId":"${CALL_ID}"})

    ; Call voice-service
    same => n,Set(START_RESP=${CURL(${VOICE_SERVICE_URL}/telephony/inbound-start,${JSON_PAYLOAD})})
    same => n,NoOp(Response: ${START_RESP})

    ; Parse KV response using CUT()
    ; Format: OK=1|ACTION=DTMF_MENU|AGENT_ID=agt_123|SESSION_ID=call_abc_xyz|...

    ; Extract fields by position (more reliable than searching)
    ; Field 1: OK=1
    same => n,Set(OK=${CUT(${CUT(START_RESP,|,1)},=,2)})

    ; Field 2: ACTION=REJECT or ACTION=DTMF_MENU
    same => n,Set(ACTION=${CUT(START_RESP,|,2)})
    same => n,Set(GATE_ACTION=${CUT(ACTION,=,2)})

    ; Branch based on action
    same => n,GotoIf($["${GATE_ACTION}" = "REJECT"]?rejected:connected)

    ; If rejected, extract SAY message (Field 3)
    same => n(rejected),NoOp(Call rejected by Inbound Call Guard v1)
    same => n,Set(SAY_FIELD=${CUT(START_RESP,|,3)})
    same => n,Set(GATE_SAY=${CUT(SAY_FIELD,=,2)})
    same => n,NoOp(Reject message: ${GATE_SAY})
    same => n,Return()

    ; If connected, extract all fields
    same => n(connected),NoOp(Call connected)

    ; Field 3: AGENT_ID=agt_xxx
    same => n,Set(AGENT_ID=${CUT(${CUT(START_RESP,|,3)},=,2)})

    ; Field 4: SESSION_ID=call_xxx_yyy
    same => n,Set(SESSION_ID=${CUT(${CUT(START_RESP,|,4)},=,2)})

    ; Field 5: GREETING=Hello! Welcome...
    same => n,Set(GREETING=${CUT(${CUT(START_RESP,|,5)},=,2)})

    ; Field 6: MENU_PROMPT=Press 1 for...
    same => n,Set(MENU_PROMPT=${CUT(${CUT(START_RESP,|,6)},=,2)})

    ; Field 7: MENU_TIMEOUT=7
    same => n,Set(MENU_TIMEOUT=${CUT(${CUT(START_RESP,|,7)},=,2)})

    ; Field 8: MENU_RETRIES=2
    same => n,Set(MENU_RETRIES=${CUT(${CUT(START_RESP,|,8)},=,2)})

    ; Field 9: REC_ENABLE=1
    same => n,Set(REC_ENABLE=${CUT(${CUT(START_RESP,|,9)},=,2)})

    ; Field 10: REC_SILENCE_S=20
    same => n,Set(REC_SILENCE_S=${CUT(${CUT(START_RESP,|,10)},=,2)})

    ; Field 11: REC_MAX_S=45
    same => n,Set(REC_MAX_S=${CUT(${CUT(START_RESP,|,11)},=,2)})

    ; Field 12: REC_PROMPT=Please leave a message...
    same => n,Set(REC_PROMPT=${CUT(${CUT(START_RESP,|,12)},=,2)})

    same => n,Return()

; ============================================================================
; Subroutine: Play Greeting
; ============================================================================

[epic-greeting]
exten => s,1,NoOp(=== Playing Greeting ===)
    same => n,NoOp(Greeting: ${GREETING})

    ; Play greeting via TTS
    same => n,Gosub(epic-speak,s,1(${GREETING}))

    same => n,Return()

; ============================================================================
; Subroutine: DTMF Menu Loop
; ============================================================================

[epic-dtmf-loop]
exten => s,1,NoOp(=== DTMF Menu Loop ===)

    ; Play menu prompt
    same => n,Gosub(epic-speak,s,1(${MENU_PROMPT}))

    ; Wait for DTMF input
    same => n,Read(DTMF_INPUT,beep,1,n,${MENU_TIMEOUT})

    ; Check if we got input
    same => n,GotoIf($[${LEN(${DTMF_INPUT})} > 0]?got_input:no_input)

    ; No input - try again or record
    same => n(no_input),NoOp(No DTMF input received)
    same => n,Set(DTMF_RETRY_COUNT=$[${DTMF_RETRY_COUNT} + 1])
    same => n,GotoIf($[${DTMF_RETRY_COUNT} >= ${MENU_RETRIES}]?check_recording:retry)

    same => n(retry),NoOp(Retrying DTMF menu)
    same => n,Gosub(epic-speak,s,1(I didn't catch that. Please try again.))
    same => n,Goto(s,1)

    same => n(check_recording),NoOp(Max retries reached)
    same => n,GotoIf($["${REC_ENABLE}" = "1"]?record_voicemail:no_recording)

    same => n(record_voicemail),NoOp(Recording voicemail)
    same => n,Gosub(epic-record-voicemail,s,1)
    same => n,Return()

    same => n(no_recording),NoOp(Recording disabled, hanging up)
    same => n,Gosub(epic-speak,s,1(Thank you for calling. Goodbye!))
    same => n,Return()

    ; Got input - process it
    same => n(got_input),NoOp(DTMF input: ${DTMF_INPUT})
    same => n,Gosub(epic-process-dtmf,s,1(${DTMF_INPUT}))

    ; Check NEXT action from response
    same => n,GotoIf($["${DTMF_NEXT}" = "HANGUP"]?hangup:continue_check)

    same => n(continue_check),GotoIf($["${DTMF_NEXT}" = "TRANSFER"]?transfer:continue)

    ; Continue - loop back
    same => n(continue),NoOp(Continuing conversation)
    same => n,Set(DTMF_RETRY_COUNT=0)
    same => n,Goto(s,1)

    ; Transfer
    same => n(transfer),NoOp(Transferring to ${TRANSFER_TO})
    same => n,Transfer(${TRANSFER_TO})
    same => n,Return()

    ; Hangup
    same => n(hangup),NoOp(Ending call)
    same => n,Return()

; ============================================================================
; Subroutine: Process DTMF Input
; ============================================================================

[epic-process-dtmf]
exten => s,1,NoOp(=== Processing DTMF: ${ARG1} ===)

    ; Build JSON payload
    same => n,Set(JSON_PAYLOAD={"sessionId":"${SESSION_ID}","digit":"${ARG1}","callId":"${CALL_ID}"})

    ; Call voice-service
    same => n,Set(DTMF_RESP=${CURL(${VOICE_SERVICE_URL}/telephony/dtmf,${JSON_PAYLOAD})})
    same => n,NoOp(Response: ${DTMF_RESP})

    ; Parse KV response
    ; Format: OK=1|SAY=Great! I can help...|NEXT=DTMF|HANGUP=0

    ; Field 1: OK=1
    same => n,Set(OK=${CUT(${CUT(DTMF_RESP,|,1)},=,2)})

    ; Field 2: SAY=...
    same => n,Set(SAY=${CUT(DTMF_RESP,|,2)})
    same => n,Set(DTMF_SAY=${CUT(SAY,=,2)})

    ; Field 3: NEXT=DTMF|TRANSFER|HANGUP
    same => n,Set(NEXT=${CUT(DTMF_RESP,|,3)})
    same => n,Set(DTMF_NEXT=${CUT(NEXT,=,2)})

    ; Field 4: HANGUP=0 or 1
    same => n,Set(HANGUP=${CUT(DTMF_RESP,|,4)})
    same => n,Set(DTMF_HANGUP=${CUT(HANGUP,=,2)})

    ; Field 5 (optional): TRANSFER_TO=+15551234567
    same => n,Set(TRANSFER_TO_FIELD=${CUT(DTMF_RESP,|,5)})
    same => n,Set(TRANSFER_TO=${CUT(TRANSFER_TO_FIELD,=,2)})

    ; Speak response
    same => n,Gosub(epic-speak,s,1(${DTMF_SAY}))

    same => n,Return()

; ============================================================================
; Subroutine: Record Voicemail
; ============================================================================

[epic-record-voicemail]
exten => s,1,NoOp(=== Recording Voicemail ===)

    ; Play prompt
    same => n,Gosub(epic-speak,s,1(${REC_PROMPT}))

    ; Record message
    same => n,Set(RECORDING_FILE=${RECORDING_DIR}/${SESSION_ID}_${CALL_ID}.${RECORDING_FORMAT})
    same => n,Record(${RECORDING_FILE}:${RECORDING_FORMAT},${REC_MAX_S},${REC_SILENCE_S},k)

    ; Get recording duration
    same => n,Set(DURATION=${SHELL(soxi -D ${RECORDING_FILE} 2>/dev/null || echo 0)})

    ; Upload to voice-service (multipart form)
    same => n,NoOp(Uploading recording: ${RECORDING_FILE}, Duration: ${DURATION}s)
    same => n,Set(UPLOAD_RESP=${SHELL(curl -s -X POST \
        -F "sessionId=${SESSION_ID}" \
        -F "callId=${CALL_ID}" \
        -F "duration=${DURATION}" \
        -F "audioFile=@${RECORDING_FILE}" \
        ${VOICE_SERVICE_URL}/telephony/record)})

    ; Parse response
    ; Format: OK=1|SAY=Thank you for your message...
    same => n,Set(SAY=${CUT(UPLOAD_RESP,|,2)})
    same => n,Set(RESPONSE_TEXT=${CUT(SAY,=,2)})

    ; Use default if parsing failed
    same => n,GotoIf($[${LEN(${RESPONSE_TEXT})} > 0]?speak:default_msg)
    same => n(default_msg),Set(RESPONSE_TEXT=Thank you for your message. Goodbye!)

    same => n(speak),Gosub(epic-speak,s,1(${RESPONSE_TEXT}))

    same => n,Return()

; ============================================================================
; Subroutine: Text-to-Speech
; ============================================================================

[epic-speak]
exten => s,1,NoOp(=== TTS: ${ARG1} ===)

    ; Use PicoTTS for local, fast synthesis
    ; Alternative: call external TTS service (ElevenLabs, etc.)

    ; Generate audio file
    same => n,Set(TTS_FILE=/tmp/tts_${UNIQUEID}.wav)
    same => n,System(pico2wave -l ${TTS_VOICE} -w ${TTS_FILE} "${ARG1}")

    ; Play audio
    same => n,Playback(${TTS_FILE})

    ; Cleanup
    same => n,System(rm -f ${TTS_FILE})

    same => n,Return()

; ============================================================================
; Hangup Handler
; ============================================================================

[epic-hangup]
exten => h,1,NoOp(=== Call Hangup ===)

    ; Get call duration
    same => n,Set(CALL_DURATION=${CDR(billsec)})
    same => n,Set(HANGUP_CAUSE=${HANGUPCAUSE})

    ; Notify voice-service
    same => n,Set(JSON_PAYLOAD={"sessionId":"${SESSION_ID}","callId":"${CALL_ID}","duration":${CALL_DURATION},"hangupCause":"${HANGUP_CAUSE}"})
    same => n,Set(HANGUP_RESP=${CURL(${VOICE_SERVICE_URL}/telephony/hangup,${JSON_PAYLOAD})})

    same => n,NoOp(Hangup notified: ${HANGUP_RESP})
    same => n,Return()

; ============================================================================
; Notes
; ============================================================================
;
; 1. Install required tools:
;    apt-get install sox libsox-fmt-all curl libttspico-utils
;
; 2. Test TTS:
;    pico2wave -l en-US -w test.wav "Hello, this is a test."
;    play test.wav
;
; 3. Configure your SIP trunk to route DIDs to [epic-inbound] context
;
; 4. Set global VOICE_SERVICE_URL to your voice-service endpoint
;
; 5. KV String Parsing:
;    - Uses CUT() function instead of jq (no external dependency)
;    - Format: KEY1=value1|KEY2=value2|KEY3=value3
;    - Extract field 2: ${CUT(response,|,2)} → "KEY2=value2"
;    - Extract value: ${CUT(field,=,2)} → "value2"
;
; 6. For production:
;    - Store sessions in Redis instead of channel variables
;    - Add proper error handling and retries
;    - Consider AGI scripts for complex logic
;
; ============================================================================
